<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Instrument Trainers</title>
<style>
  :root {
    --bg: #0c0f12;
    --panel: #14191d;
    --line: #303941;
    --ink: #f5f0e7;
    --accent: #e6b85c;
  }
  
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden; /* Prevent double scrollbars */
  }

  .top-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    height: 56px;
    background: rgba(12, 15, 18, 0.95);
    border-bottom: 1px solid var(--line);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 100;
    box-sizing: border-box;
  }

  .nav-btn {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 8px 18px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    transition: all 0.15s ease;
  }

  .nav-btn:hover {
    border-color: rgba(230, 184, 92, 0.5);
    transform: translateY(-1px);
  }

  .nav-btn.active {
    background: rgba(230, 184, 92, 0.1);
    border-color: var(--accent);
    color: var(--accent);
    transform: none;
  }

  .app-frame {
    width: 100%;
    height: 100vh;
    border: none;
    padding-top: 56px; /* Offset for the nav bar */
    box-sizing: border-box;
    display: block;
  }
</style>
</head>
<body>

  <div class="top-nav">
    <button class="nav-btn active" onclick="switchApp('guitar/index.html', this)">Don't Fret (Guitar)</button>
    <button class="nav-btn" onclick="switchApp('trumpet/index.html', this)">Brass Tacks (Trumpet)</button>
  </div>

  <iframe id="appFrame" class="app-frame" src="guitar/index.html" title="Instrument Trainer Application"></iframe>

  <script>
    function switchApp(url, btnElement) {
      // Switch the iframe source
      document.getElementById('appFrame').src = url;
      
      // Update active button states
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
    }
  </script>

</body>
</html>
